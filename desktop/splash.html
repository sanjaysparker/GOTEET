<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'"><title>Starting GOTEET</title><style>
:root{color-scheme:dark;--bg:#0c0e17;--ink:#ece9e3;--muted:#9296a5;--accent:#ffab65}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;-webkit-app-region:drag}main{height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;background:radial-gradient(ellipse at 50% 35%,#ffab650d,transparent 60%)}.field{position:absolute;inset:20px;border:1px solid #ffffff09;pointer-events:none}.orbit{position:absolute;width:270px;height:270px;border:1px solid #ffab6515;border-radius:50%;top:30px;animation:orbit 12s linear infinite}.orbit:before,.orbit:after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;background:var(--accent);left:37px;top:38px;box-shadow:0 0 12px #ffab6570}.orbit:after{left:auto;top:auto;right:37px;bottom:38px;opacity:.35}.logo{width:100px;height:100px;margin-bottom:18px;animation:assemble 1.1s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 8px 20px #ffab6512)}h1{font-family:Georgia,serif;font-weight:400;letter-spacing:.17em;margin:0 0 12px 10px;font-size:40px;animation:word 1.2s ease both}p{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0}.status{position:absolute;bottom:42px;font-size:12px;letter-spacing:0;text-transform:none}.track{position:absolute;bottom:26px;width:180px;height:2px;background:#ffffff12;overflow:hidden}.track:after{content:'';display:block;width:40%;height:100%;background:var(--accent);animation:scan 1.6s ease-in-out infinite}.version{position:absolute;right:34px;bottom:24px;font-size:10px;color:var(--muted)}@keyframes assemble{from{opacity:0;transform:translateY(20px) rotateY(65deg) scale(.7)}to{opacity:1;transform:none}}@keyframes word{from{opacity:0;letter-spacing:.35em;transform:translateY(8px)}to{opacity:1;letter-spacing:.17em;transform:none}}@keyframes scan{from{transform:translateX(-110%)}to{transform:translateX(360%)}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}.track:after{width:100%;opacity:.5}}
</style></head><body><main><div class="field"></div><div class="orbit"></div><img class="logo" src="assets/goteet-mark.svg" alt=""><h1>GOTEET</h1><p>Your work. Connected.</p><p id="status" class="status" role="status" aria-live="polite">Starting your workspace…</p><div class="track" aria-hidden="true"></div><span class="version">DESKTOP</span></main></body></html>
